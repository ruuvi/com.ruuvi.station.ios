---
targets:
  RuuviCloud:
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
    templates:
    - Framework
    sources:
    - path: Sources
      name: Cloud
    dependencies:
    - package: Humidity
    - package: BTKit
    - package: Future
    - target: RuuviOntology
    - target: RuuviUser
    - target: RuuviPool
  RuuviCloudAlertTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests/RuuviCloudTests/RuuviCloudAlertRetryTests.swift
    dependencies:
    - target: RuuviCloud
    - target: RuuviPool
    - package: Future
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RuuviCloudAlertTests:
    build:
      targets:
        RuuviCloudAlertTests: all
    test:
      targets:
      - RuuviCloudAlertTests
