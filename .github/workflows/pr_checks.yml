name: Checks for opened PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  release-automation:
    runs-on: ubuntu-latest
    name: Release automation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path) }'

      - name: Validate fastlane files
        run: |
          ruby -c fastlane/Fastfile
          ruby -c fastlane/Matchfile

      - name: Validate shell scripts
        run: |
          bash -n .github/scripts/*.sh

  swiftlint:
    runs-on: ubuntu-latest
    name: SwiftLint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint
        uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
